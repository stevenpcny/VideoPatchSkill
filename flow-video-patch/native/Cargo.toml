[package]
name = "flow_kernels"
version = "0.1.0"
edition = "2021"
description = "Optional per-pixel kernels for flow_patch.py; bit-identical to its NumPy paths"
license-file = "../INTERNAL_USE.md"
publish = false

# No dependencies: only the Rust standard library is compiled in.
[dependencies]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
panic = "abort"
